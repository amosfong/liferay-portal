_format_version: "3.0"
services:

    # The load balancer health checks the port published by LCP.json's
    # loadBalancer.targetPort, and accepts only a 200. It does not reuse the
    # readinessProbe because that probe listens on the status port rather than the
    # published one. Without a route for "GET /", Kong answers the health check with
    # its own 404, the backend never becomes healthy, and every external request gets
    # a 502 even though the pod is running and ready.
    #
    # request-termination answers from the gateway itself, so url is required but
    # never dialed. Proxying to the status listener instead would add a round trip
    # through the proxy path on every health check. The path is anchored to match
    # only "/", leaving the provisioning routes below untouched.

    -   name: health
        routes:
            -   methods:
                    -   GET
                name: health
                paths:
                    -   ~/$
                plugins:
                    -   config:
                            status_code: 200
                        name: request-termination
        url: http://localhost:8100
    -   name: provisioning-uat
        routes:
            -   methods:
                    -   POST
                name: cloud-environment-activate
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/activate$
                plugins:
                    -   config:
                            replace:
                                uri: /o/provisioning-rest/v1.0/cloud/environments/$(uri_captures["environment_id"])/activation
                        name: request-transformer
            -   methods:
                    -   POST
                name: cloud-environment-manifest
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/manifest$
                plugins:
                    -   config:
                            replace:
                                uri: /o/provisioning-rest/v1.0/cloud/environments/$(uri_captures["environment_id"])/manifest
                        name: request-transformer
        url: https://webserver-lrprovisioning-uat.lfr.cloud