# The load balancer health checks "GET /" from a fleet of roughly fifty probers,
# which lands as a burst of over a hundred access log lines every minute and
# buries real traffic. This map drives the "if=" condition on the proxy access
# log in the Dockerfile, so probes are served and counted but never logged.
#
# Matching on the user agent rather than the source address is deliberate: the
# probes arrive SNATed from cluster-internal addresses, not from Google's
# published health check ranges, so an address match would be unreliable.

map $http_user_agent $loggable {
	~*GoogleHC	0;
	default		1;
}
